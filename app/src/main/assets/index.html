function examRender(){clear();$('study').textContent=examName+' · '+Math.min(ei+1,exam.length)+' / '+exam.length;let q=exam[ei];if(!q){$('quiz').textContent='채점 결과: '+marks.filter(Boolean).length+' / '+exam.length+' ('+Math.round(100*marks.filter(Boolean).length/exam.length)+'점). 오답은 누적 복습에 저장되었습니다.';return}$('quiz').innerHTML='<h3 id="ep"></h3><input id="ea" placeholder="답 입력"><button id="ec">정답 확인</button>';$('ep').textContent=q.prompt;$('ea').hidden=q.write;$('ec').onclick=()=>{let a=$('ea').value;$('quiz').innerHTML='<p id="er"></p><button id="ey">정답</button><button id="en">오답</button>';$('er').textContent='정답: '+q.answer+(q.write?' · 직접 비교':a.replace(/\s/g,'')===q.answer.replace(/\s/g,'')?' · 일치':' · 직접 비교');for(let b of ['ey','en'])$(b).onclick=()=>{let ok=b==='ey';marks.push(ok);state[q.key]=ok;save();ei++;examRender()}}}
for(let j=0;j<grades.length;j++)$('grade').add(new Option(grades[j][0],j));$('grade').value=10;$('examStart').onclick=examStart;

function makeMock(){return makeExam(2000,100).map((q,j)=>{let t=j%4;let pool=t===0?data.map(r=>r[1]):t===1?data.map(r=>r[0]):data.flatMap(r=>r.slice(2).map(w=>w.split(':')[t===2?1:0]));return {...q,options:j<50?shuffled([q.answer,...shuffled([...new Set(pool.filter(x=>x!==q.answer))]).slice(0,3)]):null}})}
let mock=[],mi=0,ma=[],deadline=0,mt=null;
const mp=$('mockPanel');function mockStart(){if(mt&&!confirm('기존 모의고사를 종료할까요?'))return;clearInterval(mt);mock=makeMock();mi=0;ma=Array(100).fill('');deadline=Date.now()+3600000;mp.hidden=false;mockRender();mt=setInterval(()=>{let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('mockClock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)mockFinish()},250);mp.scrollIntoView()}
function mockRender(){mp.innerHTML='<p>남은 시간 <b id="mockClock"></b> · <span id="mockProgress"></span></p><h3 id="mockPrompt"></h3><div id="mockAnswer"></div><button id="mockPrev">이전</button><button id="mockNext">다음</button><button id="mockSubmit">제출</button>';let q=mock[mi];$('mockClock').textContent=Math.floor(Math.max(0,Math.ceil((deadline-Date.now())/1000))/60)+':'+String(Math.max(0,Math.ceil((deadline-Date.now())/1000))%60).padStart(2,'0');$('mockProgress').textContent=(mi+1)+' / 100 · 답변 '+ma.filter(Boolean).length+'개';$('mockPrompt').textContent=q.prompt;let a=$('mockAnswer');if(q.options){q.options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.setAttribute('aria-pressed',String(ma[mi]===v));if(ma[mi]===v)b.style.outline='3px solid #29865c';b.onclick=()=>{ma[mi]=v;mockRender()};a.append(b)})}else{let x=document.createElement('input');x.placeholder='정답 직접 입력 (한자는 키보드 또는 공책 사용)';x.value=ma[mi];x.oninput=()=>ma[mi]=x.value;a.append(x)}$('mockPrev').disabled=mi===0;$('mockNext').disabled=mi===99;$('mockPrev').onclick=()=>{mi--;mockRender()};$('mockNext').onclick=()=>{mi++;mockRender()};$('mockSubmit').onclick=()=>{if(confirm('시험을 제출할까요?'))mockFinish()}}
function mockFinish(){clearInterval(mt);mt=null;const norm=x=>x.normalize('NFKC').replace(/\s/g,'');let marks=mock.map((q,j)=>norm(q.answer)===norm(ma[j]));mp.innerHTML='<h3>채점 결과</h3><p id="mockScore"></p><div id="mockResults"></div>';function score(){let n=marks.filter(Boolean).length;$('mockScore').textContent=n+' / 100점 · '+(n>=70?'합격 기준 충족':'합격 기준 미달');mock.forEach((q,j)=>{state[q.key]=marks[j]});save()}mock.forEach((q,j)=>{let p=document.createElement('p');let label=document.createElement('span');label.textContent=(j+1)+'. '+q.prompt+' / 내 답: '+(ma[j]||'미응답')+' / 정답: '+q.answer+' ';p.append(label);if(j>=50){let c=document.createElement('input');c.type='checkbox';c.checked=marks[j];c.onchange=()=>{marks[j]=c.checked;score()};p.append(c,document.createTextNode(' 직접 정답 인정'))}else p.append(document.createTextNode(marks[j]?'정답':'오답'));$('mockResults').append(p)});score()}
$('mockStart').onclick=mockStart;


const hanmun=[["주어와 서술어", "鳥飛", "조비", "새가 난다.", "鳥는 주어, 飛는 서술어이다."], ["주어와 목적어", "吾讀書", "오독서", "나는 책을 읽는다.", "吾는 주어, 讀은 동사, 書는 목적어이다."], ["수식 관계", "大山", "대산", "큰 산", "大가 山을 꾸민다."], ["부정 不", "不知", "부지", "알지 못한다.", "不은 뒤의 동사를 부정한다."], ["부정 無", "無心", "무심", "마음이 없다.", "無는 존재하지 않음을 나타낸다."], ["금지 勿", "勿言", "물언", "말하지 마라.", "勿은 금지를 나타낸다."], ["의문 何", "何人", "하인", "어떤 사람인가?", "何는 무엇 또는 어떤이라는 뜻이다."], ["의문 誰", "誰來", "수래", "누가 오는가?", "誰는 사람을 묻는다."], ["의문 安", "安在", "안재", "어디에 있는가?", "安은 여기서 장소를 묻는다."], ["접속 而", "學而思", "학이사", "배우고 생각한다.", "而는 앞뒤 동작을 연결한다."], ["소유 之", "人之心", "인지심", "사람의 마음", "之는 여기서 관형 관계를 나타낸다."], ["대명사 之", "知之", "지지", "그것을 안다.", "之는 목적어인 대명사이다."], ["장소 於", "生於山", "생어산", "산에서 태어나다.", "於는 장소를 이끈다."], ["비교 於", "大於此", "대어차", "이것보다 크다.", "於는 비교 대상을 이끈다."], ["판단 者也", "仁者人也", "인자인야", "어진 이는 사람이다.", "者는 사람을 가리키고 也는 판단을 나타낸다."], ["조건 若", "若雨則止", "약우즉지", "만약 비가 오면 멈춘다.", "若는 조건, 則은 그 결과를 이끈다."], ["양보 雖", "雖小而强", "수소이강", "비록 작지만 강하다.", "雖는 양보를 나타낸다."], ["이유 故", "有雨故不行", "유우고불행", "비가 있으므로 가지 않는다.", "故는 이유와 결과를 연결한다."], ["수단 以", "以筆書", "이필서", "붓으로 쓴다.", "以는 수단을 이끈다."], ["가능 可", "可讀", "가독", "읽을 수 있다.", "可는 가능을 나타낸다."], ["고전 논어", "學而時習之", "학이시습지", "배우고 때때로 그것을 익힌다.", "논어 학이편. 時는 때때로, 之는 배운 것을 가리킨다."], ["고전 논어", "溫故而知新", "온고이지신", "옛것을 익혀 새것을 안다.", "논어 위정편. 故와 新은 옛것과 새것이다."], ["고전 논어", "三人行必有我師焉", "삼인행필유아사언", "세 사람이 길을 가면 반드시 나의 스승이 있다.", "논어 술이편. 必은 반드시라는 뜻이다."], ["고전 맹자", "得道者多助", "득도자다조", "도를 얻은 사람은 도움을 많이 받는다.", "맹자 공손추 하편. 者는 사람을 나타낸다."]];
const hp=document.createElement('section');hp.innerHTML='<h2>초급한문 연습</h2><p>자체 제작 기초 과정 · 공식 초급한문Ⅱ 전체 범위는 미확정</p><select id="hmSelect"></select><button id="hmShow">학습</button><button id="hmQuiz">해석 연습</button><button id="hmWrong">한문 오답</button><div id="hmBody"></div>';mp.before(hp);
hanmun.forEach((r,i)=>$('hmSelect').add(new Option((i+1)+'. '+r[0],i)));
function hmRender(i,quiz){let r=hanmun[i],b=$('hmBody');b.replaceChildren();let h=document.createElement('h3');h.textContent=r[1];b.append(h);let a=document.createElement('p');a.textContent=r[2]+' · '+r[3]+' '+r[4];a.hidden=quiz;b.append(a);if(quiz){let t=document.createElement('textarea');t.placeholder='해석을 써 보세요';b.append(t);let c=document.createElement('button');c.textContent='정답 확인';b.append(c);c.onclick=()=>{a.hidden=false;c.disabled=true;for(let ok of [true,false]){let d=document.createElement('button');d.textContent=ok?'정답':'오답';d.onclick=()=>{state['hanmun:'+i]=ok;save();b.append(document.createTextNode(' 저장됨'));d.parentNode.querySelectorAll('button').forEach(x=>x.disabled=true)};b.append(d)}}}}
$('hmShow').onclick=()=>hmRender(+$('hmSelect').value,false);$('hmQuiz').onclick=()=>hmRender(+$('hmSelect').value,true);$('hmWrong').onclick=()=>{let ids=hanmun.map((r,i)=>i).filter(i=>state['hanmun:'+i]===false);if(ids.length){$('hmSelect').value=ids[0];hmRender(ids[0],true)}else $('hmBody').textContent='한문 오답이 없습니다.'};
const baseMock=makeMock;makeMock=function(){let q=baseMock();let ids=shuffled(hanmun.map((r,i)=>i)).slice(0,10);ids.forEach((i,j)=>{let r=hanmun[i],pos=j<5?45+j:95+j-5;q[pos]={prompt:r[1]+'의 해석',answer:r[3],key:'hanmun:'+i,options:j<5?shuffled([r[3],...shuffled(hanmun.filter(x=>x[3]!==r[3]).map(x=>x[3])).slice(0,3)]):null}});return q};
